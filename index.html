<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White River Gallery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <img style="width:400px;" src=WRG-logo.png></img>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #ffffff; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0076ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .unselected {display:none; margin-bottom: 15px;}        
    </style>
</head>
<body>
    <h2>Artwork Renamer</h2>
    <form id="renameForm">
        <div class="form-group">
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" required>
            <img id="imagePreview" src="" alt="Image Preview" style="display: none; max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 4px; border: 1px solid #ccc;">
        </div>
        <div class="form-group">
            <label for="itemName">Item Name:</label>
            <input type="text" id="itemName" placeholder="The Old Guitarist" required>
        </div>
        <div class="no-negative">
            <label for="year">Year:</label>
            <input type="number" id="year" placeholder="2026" min="0" required>
        </div>
        <div class="form-group">
            <label for="medium">Medium:</label>
            <input type="text" id="medium" placeholder="Oil on Canvas" required>
        </div>
        <div class="no-negative">
            <label for="length">Length in Centimetres:</label>
            <input type="number" id="length" placeholder="120cm" min="0" required>
        </div>
        <div class="no-negative">
            <label for="width">Width in Centimetres:</label>
            <input type="number" id="width" placeholder="80cm" min="0" required>
        </div>
        <div class="no-negative">
            <label for="depth">Depth in Centimetres:</label>
            <input type="number" id="depth" placeholder="20cm" min="0" required>
        </div>
        <div class="form-group">
            <label for="framed">Framed:</label>
            <input type="checkbox" id="framed" value="frame-price">
        </div>
        <div class="frame-price unselected">
            <label for="frameprice">Frame Price:</label>
            <input type="number" id="frameprice" placeholder="R3000" min="0" required>
        </div>
        <div class="no-negative">
            <label for="price">Selling price in Rands:</label>
            <input type="number" id="price" placeholder="R35000" min="0" required>
        </div>
        <button type="submit">Rename & Download</button>
        <button type="button" onclick="clearForm()">Clear Form</button>
    </form>

    <script type="text/javascript">
        $(document).ready(function() {
            $('input[type="checkbox"]').click(function() {
                var inputValue = $(this).attr("value");
                $("." + inputValue).toggle();
            });
        });
    </script>

    <script>
      const yearInput = document.getElementById('year');
      const currentYear = new Date().getFullYear();
      if (yearInput)
      {
        yearInput.value = currentYear;
      }

      const positiveInputs = document.querySelectorAll('.no-negative');
      // 2. Loop through each input and apply the rules
      positiveInputs.forEach((input) => {
        
        // Prevent mousewheel changes
        input.addEventListener('wheel', (evt) => {
          evt.preventDefault();
        });

        // Block typing the minus sign (-) or 'e'
        input.addEventListener('keydown', (evt) => {
          if (evt.key === '-' || evt.key === 'e' || evt.key === 'E') {
            evt.preventDefault();
          }
        });

        // Block pasting negative numbers
        input.addEventListener('paste', (evt) => {
          const pasteData = evt.clipboardData.getData('text');
          if (parseFloat(pasteData) < 0) {
            evt.preventDefault();
          }
        });
        
      });


      const framedCheckbox = document.getElementById('framed');
      const framePriceDiv = document.querySelector('.frame-price');

      const framePriceInput = document.getElementById('frameprice');

      framePriceInput.addEventListener('wheel', (evt) => {
        evt.preventDefault();
      });

      framePriceInput.addEventListener('keydown', (evt) => {
        if (evt.key === '-' || evt.key === 'e' || evt.key === 'E') {
          evt.preventDefault();
      }
      });

    // Block pasting negative numbers
      framePriceInput.addEventListener('paste', (evt) => {
        const pasteData = evt.clipboardData.getData('text');
        if (parseFloat(pasteData) < 0) {
          evt.preventDefault();
        }
      });

      // 2. Listen for when the user clicks the checkbox
      framedCheckbox.addEventListener('change', () => {
        if (framedCheckbox.checked) {
          // If checked: make it required and show the container
          framePriceInput.required = true;
          framePriceDiv.classList.remove('unselected');
        } else {
          // If unchecked: remove required status and hide the container
          framePriceInput.required = false;
          framePriceDiv.classList.add('unselected');
          framePriceInput.value = ''; // Optional: clear the value if they uncheck it
        }
      });

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }

        const clearForm = () =>
        {
          const form = document.querySelector('form');
          const framePrice = document.querySelector('.frame-price');
          const preview = document.getElementById('imagePreview');
          preview.style.display = 'none';
          framePrice.style.display = "none";
          framePrice.style.marginBottom = "15px";
          form.reset();

          const yearInput = document.getElementById('year');
          const currentYear = new Date().getFullYear();
          if (yearInput)
          {
            yearInput.value = currentYear;
          }
        };
        
        document.getElementById('renameForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fileInput = document.getElementById('imageInput');
            const itemName = document.getElementById('itemName').value;
            const year = document.getElementById('year').value;
            const medium = document.getElementById('medium').value;            
            const length = document.getElementById('length').value;
            const width = document.getElementById('width').value;
            const depth = document.getElementById('depth').value;
            const price = document.getElementById('price').value;
            const framed = document.getElementById('framed').checked ? "Framed" : "Unframed";
            const framePrice = document.getElementById('framed').checked ? document.getElementById('frameprice').value : "0";

            if (fileInput.files.length === 0) return;

            const originalFile = fileInput.files[0];
            const extension = originalFile.name.substring(originalFile.name.lastIndexOf('.'));
            const cleanString = (str) => {
              return str
                .replace(/[^a-zA-Z0-9\s_-]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            };
            
            const safeName = cleanString(itemName);
            const safeYear = cleanString(year);
            const safeMedium = cleanString(medium);
            const safeWidth = cleanString(width);
            const safeLength = cleanString(length);
            const safeDepth = cleanString(depth);
            
            const newFilename = `${safeName},${safeYear},R${price},${safeMedium},${safeLength}cmx${safeWidth}cmx${safeDepth}cm,${framed},R${framePrice}${extension}`;

            const blobUrl = URL.createObjectURL(originalFile);
            const downloadLink = document.createElement('a');
            downloadLink.href = blobUrl;
            downloadLink.download = newFilename;
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(blobUrl);
        });
    </script>
</body>
</html>
